         0点 26日 平均 +0.09%             勝率 54%
        -2点 18日 平均 -0.78% 中央値 -1.34% 勝率 33%
      銘柄別では 9101 差+1.18pt(勝率81%) / 9104 差+1.40pt(勝率75%)。

      商社の +2.21pt に対して +1.29pt で、シグナルとしては弱い。
      検証期間は単一局面（3ヶ月）で、コンテナ市況が転換したときに
      同じ関係が続く保証はない。20取引ほど溜まったら再検証する。

