          急変閾値: 5.8   # 実測の|変化率|90%点 5.79%
          不感帯: 0.82
          プラス: 前日比で上昇
          マイナス: 前日比で低下
    見送り: []
    備考: >
      取引対象は 9104 商船三井、9101 日本郵船は連動確認。
      9104 の方が各指標との相関が高く（SEA 0.44 vs 0.32）、スコアに対する差も大きい。

      実測値（2社平均の翌日リターン、n=60営業日）:
