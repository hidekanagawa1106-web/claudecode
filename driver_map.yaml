# 連動グループ定義表
# ============================================================
# 「翌日ウォッチ候補」を執行に渡すために必要な情報を、グループ単位で持つ。
#
#   連動確認 … 運用方針_v2 §3-1 条件4「連動銘柄が同方向に動いているか」の照合先。
#              ここに挙げた銘柄は確認用であり、売買対象ではない。
#   朝スコア … 運用方針_v2 §2「毎朝の判定」。各項目 +1 / 0 / -1 で採点し、
#              閾値以上なら場中に条件を探す。下回る日は何もしない。
#   見送り   … スコアに関わらずそのグループを見送る条件（§2 枠Cの米関税に相当）。
#
# このファイルは判定の材料を定義するだけで、売買の可否は判断しない。
# 最終的なエントリーは場中の順張り4条件で別途判断する。

共通:
  # ニューストピック。1トピック1回だけ取得し、全グループで使い回す。
  # 「事象がどちらに動いたか」だけをここで判定し、それが各グループに
  # プラスかマイナスかは、グループ側の 感応度 で決める。
  #   項目スコア = 事象の方向(+1/0/-1) × 感応度(+1/-1)
  # 同じ利上げ報道がメガバンクにはプラス、自動車には円高要因でマイナスになる、
  # という関係をこの掛け算で表す。
  ニューストピック:
    金融政策:
      説明: 日銀の政策金利が引き締め方向に動いたか
      検索: ["日銀 利上げ", "日銀 金融政策決定会合"]
      強まる語: [利上げ, 引き上げ, 上振れ, 加速, 前倒し, タカ派, 早期]
      弱まる語: [据え置き, 見送り, 引き下げ, 下振れ, 慎重, 後ずれ, ハト派, 緩和]
    通商関税:
      説明: 関税・通商が悪化方向に動いたか
      検索: ["自動車 関税", "日米 通商 交渉"]
      強まる語: [引き上げ, 発動, 強化, 制裁, 追加関税, 決裂]
      弱まる語: [撤廃, 引き下げ, 緩和, 合意, 除外, 猶予]
    地政学:
      説明: 地政学リスクが高まったか
      検索: ["地政学リスク", "防衛 安全保障"]
      強まる語: [緊張, 衝突, 攻撃, 侵攻, 発射, 警戒]
      弱まる語: [停戦, 和平, 合意, 収束, 緩和]
    防衛政策:
      説明: 防衛費・装備移転が拡大方向に動いたか
      検索: ["防衛費 増額", "防衛装備移転"]
      強まる語: [増額, 拡大, 解禁, 緩和, 輸出, 受注]
      弱まる語: [削減, 縮小, 凍結, 見送り]
    米ハイテク決算:
      説明: 米ビッグテック・半導体大手の決算が上振れたか
      検索: ["マイクロソフト 決算", "エヌビディア 決算", "米ハイテク 決算 半導体"]
      強まる語: [上回る, 上方修正, 増益, 増収, 過去最高, 好調, 急騰, 最高益, 上振れ]
      弱まる語: [下回る, 下方修正, 減益, 減収, 失望, 急落, 未達, 下振れ]
    航空需要:
      説明: 航空機・エンジンの需要が強いか
      検索: ["航空機 受注", "航空エンジン 需要"]
      強まる語: [受注, 増産, 好調, 拡大, 過去最高]
      弱まる語: [減産, 延期, キャンセル, 低迷]

  ニュース:
    許可ソース:
      - 日本経済新聞
      - ロイター
      - Bloomberg
      - ブルームバーグ
      - 時事ドットコム
      - 時事通信ニュース
      - 朝日新聞
      - Yahoo!ニュース
      - 東洋経済オンライン
      - NHK
    収集時間: 36   # 直近この時間内に配信された記事のみ
    最大件数: 5

  # §2 イベントフィルタ。スコアより優先し、全グループに適用する。
  イベントフィルタ:
    - 条件: 決算発表の当日・翌日
      対応: ポジションを通常の半分以下、または見送り
    - 条件: FOMC・日銀会合の当日
      対応: 寄り付き直後は入らない
    - 条件: 決算・会合をまたぐ持ち越し
      対応: しない

グループ:

  半導体・AI関連:
    由来: 運用方針_v2 §2 枠A / §1 連動確認用（キオクシア向けの定義を流用）
    連動確認:
      国内: ["8035 東京エレクトロン"]
      海外: ["SOX指数", "サンディスク(SNDK)"]
    朝スコア:
      閾値: 3
      項目:
        - 名前: SOX指数
          ticker: ["^SOX"]
          急変閾値: 3.0
          プラス: 前日比プラスで終了
          マイナス: 前日比マイナスで終了
        - 名前: ビッグテック
          ticker: ["MSFT", "NVDA", "GOOGL", "AMZN", "AAPL"]
          急変閾値: 5.0
          時間外監視: true   # 米国の決算は引け後に出るため、通常取引の終値には載らない
          プラス: 平均が前日比プラス
          マイナス: 平均が前日比マイナス
          注記: >
            日本の半導体株を動かす最上流。2026-07-30の米国市場でマイクロソフトが
            +15.51%、これを受けてSOXが+8.19%となり、翌7/31の日本市場で
            半導体・AI関連20銘柄中18銘柄が+3%以上、8銘柄がストップ高となった。
            平均で採点しつつ、1銘柄でも急変閾値を超えたら個別に警告を出す。
        - 名前: サンディスク(SNDK)
          ticker: ["SNDK"]
          急変閾値: 7.0
          プラス: 前日比プラス
          マイナス: 前日比マイナス
        - 名前: ドル円
          ticker: ["JPY=X"]
          急変閾値: 1.5
          プラス: 円安方向
          マイナス: 円高方向
        - 名前: 米ハイテク決算
          トピック: 米ハイテク決算
          感応度: 1   # 設備投資見通しに直結する最上流の材料
        - 名前: 金融政策(利上げ方向)
          トピック: 金融政策
          感応度: -1  # 円高要因かつグロース株は金利上昇に弱い
        - 名前: PTS価格
          ticker: null
          プラス: 前日終値比プラス
          マイナス: 前日終値比マイナス
          注記: 候補銘柄自身のPTS価格を見る。自動取得できないため要手動確認
    見送り: []
    備考: >
      キオクシア(285A)向けに作られた定義をグループ全体へ流用している。
      サンディスクはNAND市況の指標であり、東京エレクトロンやアドバンテストなど
      装置株への効きは弱い可能性がある。運用しながら要確認。
      キオクシア個別については docs/kioxia-morning-briefing.md により詳細な
      判定ルール（SKハイニックスADRの扱いなど）がある。

  メガバンク:
    由来: 運用方針_v2 §2 枠B / §1 連動確認用（三菱UFJ向けの定義を流用）
    連動確認:
      国内: ["8316 三井住友フィナンシャルグループ", "8411 みずほフィナンシャルグループ"]
      海外: ["米10年国債利回り", "米銀大手"]
    朝スコア:
      閾値: 3
      項目:
        - 名前: 米10年国債利回り
          ticker: ["^TNX"]
          急変閾値: 4.0
          プラス: 前日比で上昇
          マイナス: 前日比で低下
        - 名前: ドル円
          ticker: ["JPY=X"]
          急変閾値: 1.5
          プラス: 円安方向
          マイナス: 円高方向
        - 名前: 米銀大手
          ticker: ["XLF"]
          急変閾値: 2.5
          プラス: 前日比プラス
          マイナス: 前日比マイナス
        - 名前: 金融政策(利上げ方向)
          トピック: 金融政策
          感応度: 1   # 利ざや・運用利回りの改善で追い風
        - 名前: 日銀会合まで
          プラス: 15営業日以内
          マイナス: なし
    見送り: []

  防衛・重工:
    由来: 運用方針_v2 §2 枠C / §1 連動確認用（IHI向けの定義を流用）
    連動確認:
      国内: ["6208 石川製作所", "7012 川崎重工業"]
      海外: ["米国防衛株"]
    朝スコア:
      閾値: 2
      項目:
        - 名前: 航空需要
          トピック: 航空需要
          感応度: 1
          注記: IHIの航空エンジン事業に紐づく指標。三菱重工・川崎重工への効きは要確認
        - 名前: 地政学リスク
          トピック: 地政学
          感応度: 1   # 緊張の高まりは防衛関連の追い風
        - 名前: 国防費・装備移転
          トピック: 防衛政策
          感応度: 1
        - 名前: 米国防衛株
          ticker: ["ITA"]
          急変閾値: 3.0
          プラス: 前日比プラス
          マイナス: 前日比マイナス
        - 名前: GX・個別材料
          検索: ["GX 脱炭素 政策"]
          プラス: 該当あり
          マイナス: なし
    見送り:
      - 米関税のネガティブニュースがある日は、スコアに関わらず見送り

  自動車:
    由来: 新規定義（運用方針_v2 §2 の形式に準拠）
    連動確認:
      国内: ["7203 トヨタ自動車", "6902 デンソー"]
      海外: ["米自動車株(GM・フォード・テスラ)", "ドル円"]
    朝スコア:
      閾値: 3
      項目:
        - 名前: ドル円
          ticker: ["JPY=X"]
          急変閾値: 1.5
          プラス: 円安方向
          マイナス: 円高方向
          注記: トヨタで1円の円安が営業利益数百億円規模に効くため、最重要項目
        - 名前: 米国自動車株
          ticker: ["GM", "F", "TSLA"]
          急変閾値: 4.0
          プラス: 前日比プラス
          マイナス: 前日比マイナス
        - 名前: 通商・関税報道
          トピック: 通商関税
          感応度: -1  # 関税強化は輸出採算の逆風
        - 名前: 金融政策(利上げ方向)
          トピック: 金融政策
          感応度: -1  # 利上げは円高を招き輸出採算の逆風
        - 名前: 日経平均先物(ナイトセッション)
          ticker: ["^N225"]
          急変閾値: 2.0
          プラス: 前日比プラス
          マイナス: 前日比マイナス
    見送り:
      - 米国の対日自動車関税の引き上げ報道がある日は、スコアに関わらず見送り
    備考: >
      米10年国債利回りは意図的に外している。円安要因としてはプラス、
      自動車ローン金利としてはマイナスに働き、方向が定まらないため。

  保険:
    由来: 新規定義（運用方針_v2 §2 枠Bを保険向けに組み替え）
    連動確認:
      国内: ["8306 三菱UFJフィナンシャル・グループ", "8766 東京海上ホールディングス"]
      海外: ["米10年国債利回り"]
    朝スコア:
      閾値: 3
      項目:
        - 名前: 金融政策(利上げ方向)
          トピック: 金融政策
          感応度: 1   # 生保は国内金利が運用利回りに直結する
        - 名前: 米10年国債利回り
          ticker: ["^TNX"]
          急変閾値: 4.0
          プラス: 前日比で上昇
          マイナス: 前日比で低下
        - 名前: 日経平均
          ticker: ["^N225"]
          急変閾値: 2.0
          プラス: 前日比プラス
          マイナス: 前日比マイナス
          注記: 株式含み益の増減がソルベンシーに効く
        - 名前: 日銀会合まで
          プラス: 15営業日以内
          マイナス: なし
    見送り:
      - 大規模自然災害の発生・接近報道がある日は見送り（台風・地震）
    備考: >
      損保(MS&AD・東京海上)と生保(第一ライフ)は本来別の材料で動く。
      生保は金利が支配的、損保は災害と政策保有株の売却進捗。
      上記は共通項である金利・株式市場で組んでおり、災害の見送り条件は
      実質的に損保2社にしか該当しない。動きが噛み合わないようならグループ分割を検討する。

  # --- 以下は未定義。候補が出た場合は「朝スコアなし」として提示する ---

  商社:
    由来: 未定義
    連動確認: {}
    朝スコア: null
    見送り: []

  海運:
    由来: 未定義
    連動確認: {}
    朝スコア: null
    見送り: []

# 連動グループを持たない銘柄（driver_tags.csv の group が空欄）は、
# 個別材料で動くため連動確認の対象を持たない。朝スコアも未定義。
単独銘柄:
  朝スコア: null
  備考: >
    NTT・東京電力・ソニー・任天堂・日立・NEC・日本製鉄・オリエンタルランドなど。
    市場全体の指標（日経平均先物・ドル円）と個別材料で判断する想定だが、
    共通の判定表はまだ作っていない。
