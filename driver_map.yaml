# 連動グループ定義表
# ============================================================
# 「翌日ウォッチ候補」を執行に渡すために必要な情報を、グループ単位で持つ。
#
#   連動確認 … 運用方針_v2 §3-1 条件4「連動銘柄が同方向に動いているか」の照合先。
#              ここに挙げた銘柄は確認用であり、売買対象ではない。
#   朝スコア … そのグループにマクロ面の追い風が吹いているかの目安。
#              各項目 +1 / 0 / -1 で採点する。閾値は「材料が揃っている」と
#              言える水準の目安であって、候補を通す/落とすゲートではない。
#   見送り   … そのグループを見送る条件（§2 枠Cの米関税に相当）。
#
# 朝スコアは銘柄スコアに加算していない。候補一覧には併記するだけで、
# 順位付けには一切使わない。理由は2つ。
#   1. 商社以外の5グループは閾値・感応度が未検証（トピックを含むと過去再現ができない）。
#      検証されていない数字をランキングに混ぜない。
#   2. マクロが良い日にテクニカル条件を重ねると成績が落ちる例が実測で出ている
#      （8058、60営業日: マクロ○のみ +1.44% → テクニカル条件を追加すると +0.65%）。
#      両者は互いのゲートにせず、2本のトラックとして並べる。
#
# 不感帯（2026-08-04 追加）
# ------------------------------------------------------------
# 採点は「プラスなら +1 / マイナスなら -1」で、以前は不感帯が無かった。
# そのためドル円 +0.01% が満点扱いになり、数分違いの2回の実行で
# 半導体・AI関連が +3/+3（発火）から +1/+3（未達）に変わった。
# 閾値到達の可否が為替の0.02ポイントで決まっていたことになる。
#
# 各項目の 不感帯 は |日次変化率| の15%点。指標ごとに日次のブレ幅が
# 10倍違う（ドル円 σ=0.39% vs サンディスク σ=8.83%）ため、
# 一律 0.3% のような固定値にはしない。固定0.3%だとドル円は80%の日が
# 0点になり、SOX指数は8%しか0点にならない。
# 較正の考え方は 急変閾値（発動率およそ10%）と同じ。
#
# 実測（各指標に日次σの5%の摂動を与え、閾値到達の可否がひっくり返る割合。
# 200試行、摂動は全案で共通の対応のある比較）:
#
#                なし   10%点  15%点  20%点  30%点
#   半導体・AI関連  3.8%   1.4%   0.5%   1.2%   2.0%
#   メガバンク     1.3%   0.5%   0.3%   0.6%   1.7%
#   自動車       0.7%   1.0%   0.4%   1.0%   1.7%
#   商社        1.0%   1.2%   2.2%   1.2%   2.1%
#   海運        1.4%   3.1%   2.5%   1.3%   0.4%
#   平均        1.2%   1.0%   0.8%   0.8%   1.1%
#
#   発火率 商社  23%    18%    16%    13%    11%
#   発火率 海運  24%    18%    13%    10%    10%
#   発火率 自動車 33%    26%    26%    26%    20%
#
# 15%点を採った。問題が出た半導体・AI関連で最良（3.8%→0.5%）、
# メガバンクと自動車でも最良、平均は20%点と同率。発火率の犠牲は
# 20%点より小さい（海運 10%→13%、商社 13%→16%）。
#
# 点数が動いたときの振れ幅は 1.5〜2.1点 → 約1.0点。
# 「+1 と -1 の間で飛ぶ」が「0 との間で動く」に変わるため半分になる。
#
# 不感帯では直らないもの: 米国株の時間外による振れ。8:00 JST は 19:00 ET で、
# 同じ朝の2回の実行でサンディスクが +6.03% → -5.09% と11ポイント動いた実測がある。
# 不感帯（0.95%）より桁が大きく、これは取得時刻の問題であって採点の問題ではない。
#
# このファイルは判定の材料を定義するだけで、売買の可否は判断しない。
# 最終的なエントリーは場中の順張り4条件で別途判断する。

共通:
  # ニューストピック。1トピック1回だけ取得し、全グループで使い回す。
  # 「事象がどちらに動いたか」だけをここで判定し、それが各グループに
  # プラスかマイナスかは、グループ側の 感応度 で決める。
  #   項目スコア = 事象の方向(+1/0/-1) × 感応度(+1/-1)
  # 同じ利上げ報道がメガバンクにはプラス、自動車には円高要因でマイナスになる、
  # という関係をこの掛け算で表す。
  ニューストピック:
    金融政策:
      説明: 日銀の政策金利が引き締め方向に動いたか
      検索: ["日銀 利上げ", "日銀 金融政策決定会合"]
      強まる語: [利上げ, 引き上げ, 上振れ, 加速, 前倒し, タカ派, 早期]
      弱まる語: [据え置き, 見送り, 引き下げ, 下振れ, 慎重, 後ずれ, ハト派, 緩和]
    通商関税:
      説明: 関税・通商が悪化方向に動いたか
      検索: ["自動車 関税", "日米 通商 交渉"]
      強まる語: [引き上げ, 発動, 強化, 制裁, 追加関税, 決裂]
      弱まる語: [撤廃, 引き下げ, 緩和, 合意, 除外, 猶予]
    地政学:
      説明: 地政学リスクが高まったか
      検索: ["地政学リスク", "防衛 安全保障"]
      強まる語: [緊張, 衝突, 攻撃, 侵攻, 発射, 警戒]
      弱まる語: [停戦, 和平, 合意, 収束, 緩和]
    防衛政策:
      説明: 防衛費・装備移転が拡大方向に動いたか
      検索: ["防衛費 増額", "防衛装備移転"]
      強まる語: [増額, 拡大, 解禁, 緩和, 輸出, 受注]
      弱まる語: [削減, 縮小, 凍結, 見送り]
    米ハイテク決算:
      説明: 米ビッグテック・半導体大手の決算が上振れたか
      検索: ["マイクロソフト 決算", "エヌビディア 決算", "米ハイテク 決算 半導体"]
      強まる語: [上回る, 上方修正, 増益, 増収, 過去最高, 好調, 急騰, 最高益, 上振れ]
      弱まる語: [下回る, 下方修正, 減益, 減収, 失望, 急落, 未達, 下振れ]
    航空需要:
      説明: 航空機・エンジンの需要が強いか
      検索: ["航空機 受注", "航空エンジン 需要"]
      強まる語: [受注, 増産, 好調, 拡大, 過去最高]
      弱まる語: [減産, 延期, キャンセル, 低迷]

  ニュース:
    許可ソース:
      - 日本経済新聞
      - ロイター
      - Bloomberg
      - ブルームバーグ
      - 時事ドットコム
      - 時事通信ニュース
      - 朝日新聞
      - Yahoo!ニュース
      - 東洋経済オンライン
      - NHK
    収集時間: 36   # 直近この時間内に配信された記事のみ
    最大件数: 5

  # §2 イベントフィルタ。スコアより優先し、全グループに適用する。
  イベントフィルタ:
    - 条件: 決算発表の当日・翌日
      対応: ポジションを通常の半分以下、または見送り
    - 条件: FOMC・日銀会合の当日
      対応: 寄り付き直後は入らない
    - 条件: 決算・会合をまたぐ持ち越し
      対応: しない

グループ:

  半導体・AI関連:
    由来: 運用方針_v2 §2 枠A / §1 連動確認用（キオクシア向けの定義を流用）
    連動確認:
      国内: ["8035 東京エレクトロン"]
      海外: ["SOX指数", "サンディスク(SNDK)"]
    朝スコア:
      閾値: 3
      項目:
        - 名前: SOX指数
          ticker: ["^SOX"]
          急変閾値: 5.9
          不感帯: 1.0
          プラス: 前日比プラスで終了
          マイナス: 前日比マイナスで終了
        - 名前: ビッグテック
          ticker: ["MSFT", "NVDA", "GOOGL", "AMZN", "AAPL"]
          急変閾値: 5.8
          不感帯: 0.29
          時間外監視: true   # 米国の決算は引け後に出るため、通常取引の終値には載らない
          プラス: 平均が前日比プラス
          マイナス: 平均が前日比マイナス
          注記: >
            日本の半導体株を動かす最上流。2026-07-30の米国市場でマイクロソフトが
            +15.51%、これを受けてSOXが+8.19%となり、翌7/31の日本市場で
            半導体・AI関連20銘柄中18銘柄が+3%以上、8銘柄がストップ高となった。
            平均で採点しつつ、1銘柄でも急変閾値を超えたら個別に警告を出す。
        - 名前: サンディスク(SNDK)
          ticker: ["SNDK"]
          急変閾値: 14.1
          不感帯: 0.95
          プラス: 前日比プラス
          マイナス: 前日比マイナス
        - 名前: ドル円
          ticker: ["JPY=X"]
          急変閾値: 0.4
          不感帯: 0.04
          プラス: 円安方向
          マイナス: 円高方向
        - 名前: 米ハイテク決算
          トピック: 米ハイテク決算
          感応度: 1   # 設備投資見通しに直結する最上流の材料
        - 名前: 金融政策(利上げ方向)
          トピック: 金融政策
          感応度: -1  # 円高要因かつグロース株は金利上昇に弱い
        - 名前: PTS価格
          ticker: null
          プラス: 前日終値比プラス
          マイナス: 前日終値比マイナス
          注記: 候補銘柄自身のPTS価格を見る。自動取得できないため要手動確認
    見送り: []
    備考: >
      キオクシア(285A)向けに作られた定義をグループ全体へ流用している。
      サンディスクはNAND市況の指標であり、東京エレクトロンやアドバンテストなど
      装置株への効きは弱い可能性がある。運用しながら要確認。
      キオクシア個別については docs/kioxia-morning-briefing.md により詳細な
      判定ルール（SKハイニックスADRの扱いなど）がある。

  メガバンク:
    由来: 運用方針_v2 §2 枠B / §1 連動確認用（三菱UFJ向けの定義を流用）
    連動確認:
      国内: ["8316 三井住友フィナンシャルグループ", "8411 みずほフィナンシャルグループ"]
      海外: ["米10年国債利回り", "米銀大手"]
    朝スコア:
      閾値: 3
      項目:
        - 名前: 米10年国債利回り
          ticker: ["^TNX"]
          急変閾値: 1.4
          不感帯: 0.31
          プラス: 前日比で上昇
          マイナス: 前日比で低下
        - 名前: ドル円
          ticker: ["JPY=X"]
          急変閾値: 0.4
          不感帯: 0.04
          プラス: 円安方向
          マイナス: 円高方向
        - 名前: 米銀大手
          ticker: ["XLF"]
          急変閾値: 1.4
          不感帯: 0.2
          プラス: 前日比プラス
          マイナス: 前日比マイナス
        - 名前: 金融政策(利上げ方向)
          トピック: 金融政策
          感応度: 1   # 利ざや・運用利回りの改善で追い風
        - 名前: 日銀会合まで
          プラス: 15営業日以内
          マイナス: なし
    見送り: []

  防衛・重工:
    由来: 運用方針_v2 §2 枠C / §1 連動確認用（IHI向けの定義を流用）
    連動確認:
      国内: ["6208 石川製作所", "7012 川崎重工業"]
      海外: ["米国防衛株"]
    朝スコア:
      閾値: 2
      項目:
        - 名前: 航空需要
          トピック: 航空需要
          感応度: 1
          注記: IHIの航空エンジン事業に紐づく指標。三菱重工・川崎重工への効きは要確認
        - 名前: 地政学リスク
          トピック: 地政学
          感応度: 1   # 緊張の高まりは防衛関連の追い風
        - 名前: 国防費・装備移転
          トピック: 防衛政策
          感応度: 1
        - 名前: 米国防衛株
          ticker: ["ITA"]
          急変閾値: 2.4
          不感帯: 0.23
          プラス: 前日比プラス
          マイナス: 前日比マイナス
        - 名前: GX・個別材料
          検索: ["GX 脱炭素 政策"]
          プラス: 該当あり
          マイナス: なし
    見送り:
      - 米関税のネガティブニュースがある日は、スコアに関わらず見送り

  自動車:
    由来: >
      自動車5銘柄（7203/7267/7269/5108/6902）の翌日リターンに対する前夜の海外
      指標の相関を、2026-05-08〜07-31 の60営業日で実測して組み直した（19指標を検定）。
      米10年債 -0.38 / GM 0.38 / フォード 0.37 / ステランティス 0.36 /
      Magna 0.33 / トヨタADR 0.33 / Aptiv 0.29 / ホンダADR 0.26 が p<0.05。
      これらは互いに 0.3〜0.7 で相関しており「海外メーカー」「部品」「ADR」は
      実質1つの要因のため、自動車株1軸に集約した。
      トヨタ・ホンダのADRは、前日の東京終値を差し引いた残差でも相関が残る
      （トヨタADR→トヨタ 素0.36 / 残差0.31）。NY時間帯で新しく価格がついた分に
      情報があるということで、旧定義には入っていなかった。
    連動確認:
      国内: ["7203 トヨタ自動車", "6902 デンソー"]
      海外: ["トヨタADR(TM)", "米10年国債利回り"]
    朝スコア:
      閾値: 2
      項目:
        - 名前: 自動車株（GM・F・STLA・トヨタADR・ホンダADR）
          ticker: ["GM", "F", "STLA", "TM", "HMC"]
          急変閾値: 6.4
          不感帯: 0.36
          プラス: 前日比で上昇
          マイナス: 前日比で低下
        - 名前: 米10年国債利回り
          ticker: ["^TNX"]
          感応度: -1   # 上昇は自動車ローン金利の逆風。実測 -0.38 で最強かつ符号は明確
          急変閾値: 1.4
          不感帯: 0.31
          プラス: 前日比で低下
          マイナス: 前日比で上昇
        # --- 以下は採点対象外。材料として表示するだけで合計には入れない ---
        - 名前: ドル円
          ticker: ["JPY=X"]
          採点: false
          急変閾値: 0.4
          不感帯: 0.04
          注記: >
            トヨタで1円の円安が営業利益数百億円規模に効くという関係は実在するが、
            この60営業日では翌日の株価に出なかった（r=+0.10, p=0.43）。
            スコアに入れると単調性が崩れ、勝率79%→64%、差+1.18pt→+0.58pt まで
            落ちたため採点から外した。理屈が否定されたわけではないので、
            指標としては残して朝の判断材料にする。
        - 名前: 通商・関税報道
          トピック: 通商関税
          感応度: -1
          採点: false   # 過去再現ができず未検証。関税リスクは下の見送り条件で担保する
        - 名前: 金融政策(利上げ方向)
          トピック: 金融政策
          感応度: -1
          採点: false   # 同上
    見送り:
      - 米国の対日自動車関税の引き上げ報道がある日は、スコアに関わらず見送り
    備考: >
      実測値（5銘柄平均の翌日リターン、n=60営業日）:
        +2点 19日 平均 +1.04% 中央値 +1.21% 勝率 79%
         0点 19日 平均 +0.23% 中央値 -0.03% 勝率 47%
        -2点 22日 平均 -0.44% 中央値 -0.49% 勝率 36%
      5銘柄すべてで機能する。トヨタ +1.48pt / デンソー +1.39pt / スズキ +1.21pt /
      ホンダ +1.05pt / ブリヂストン +0.75pt。

      旧定義から外したもの:
        テスラ  r=+0.11 (p=0.39)。GM・フォードを平均で薄めていた
        日経平均先物  r=-0.06 (p=0.64)。加えて ^N225 が返すのは現物指数の
          前営業日15:00終値で、ナイトセッションではなかった。CME先物 NIY=F に
          差し替えても r=-0.07 で変わらないため、項目ごと落とした

      留保: 2軸の相関が 0.48 あり、商社(-0.09)・海運(0.04)のような独立した
      2軸ではない。部分的な二重計上が残っている。1軸だけ（自動車株、閾値+1）でも
      差+1.21pt とほぼ同じだが、発動率48%と緩く勝率も69%に下がるため2軸を採った。
      検証期間は単一局面（3ヶ月）。20取引ほど溜まったら再検証する。

  保険:
    由来: 新規定義（運用方針_v2 §2 枠Bを保険向けに組み替え）
    連動確認:
      国内: ["8306 三菱UFJフィナンシャル・グループ", "8766 東京海上ホールディングス"]
      海外: ["米10年国債利回り"]
    朝スコア:
      閾値: 3
      項目:
        - 名前: 金融政策(利上げ方向)
          トピック: 金融政策
          感応度: 1   # 生保は国内金利が運用利回りに直結する
        - 名前: 米10年国債利回り
          ticker: ["^TNX"]
          急変閾値: 1.4
          不感帯: 0.31
          プラス: 前日比で上昇
          マイナス: 前日比で低下
        - 名前: 日経平均
          ticker: ["^N225"]
          急変閾値: 4.0
          不感帯: 0.3
          プラス: 前日比プラス
          マイナス: 前日比マイナス
          注記: 株式含み益の増減がソルベンシーに効く
        - 名前: 日銀会合まで
          プラス: 15営業日以内
          マイナス: なし
    見送り:
      - 大規模自然災害の発生・接近報道がある日は見送り（台風・地震）
    備考: >
      損保(MS&AD・東京海上)と生保(第一ライフ)は本来別の材料で動く。
      生保は金利が支配的、損保は災害と政策保有株の売却進捗。
      上記は共通項である金利・株式市場で組んでおり、災害の見送り条件は
      実質的に損保2社にしか該当しない。動きが噛み合わないようならグループ分割を検討する。

  商社:
    由来: >
      三菱商事(8058)の翌日リターンに対する前夜の海外指標の相関を、
      2026-05-08〜07-31 の60営業日で実測して組んだ。
      銅 0.47 / BHP 0.41 / 商品指数 0.40 / XME 0.39 / 原油 0.23 / XLE 0.22 に対し、
      ドル円は -0.03 で無相関だったため為替は入れていない。
      銅⇔XME、原油⇔XLE がそれぞれ 0.7 台で二重計上になるため2軸に集約した。
      金属軸とエネルギー軸の相関は -0.09 で独立している。
    連動確認:
      国内: ["8031 三井物産"]   # 8058との同日相関 0.82。伊藤忠・住友は 0.62 で弱い
      海外: ["銅先物", "BHP"]
    朝スコア:
      閾値: 2
      項目:
        - 名前: 金属（銅・BHP・XME）
          ticker: ["HG=F", "BHP", "XME"]
          急変閾値: 4.8
          不感帯: 0.43
          プラス: 前日比で上昇
          マイナス: 前日比で低下
        - 名前: エネルギー（原油・XLE）
          ticker: ["CL=F", "XLE"]
          急変閾値: 5.8
          不感帯: 0.43
          プラス: 前日比で上昇
          マイナス: 前日比で低下
    見送り: []
    備考: >
      実測値（8058の翌日リターン、n=60営業日）:
        +2点 16日 平均 +1.44% 中央値 +0.85% 勝率 81%
         0点 28日 平均 -0.65%             勝率 32%
        -2点 16日 平均 -0.99%             勝率 25%
      スコアは単調で、外れ値だけに支えられてはいない（中央値でも +0.85%）。
      ただし該当16日のうち 5/13 の +6.62% はバークシャー子会社の大量保有報告書
      （前日引け後提出、保有比率11.06%）が原因で、金属市況では説明できない。
      検証期間は銅の上昇局面に偏っており、資源が下落局面に入ったとき同じ関係が
      続く保証はない。20取引ほど溜まったら再検証する。

      ニューストピックは入れていない。見出し6,569件を収集して語感情スコアと
      翌日リターンの相関を測ったところ、記事日を前営業日までに厳密に絞ると
      最大 r=0.16（p=0.22）で、有意なものが1つも残らなかった。
      「銅価格が最高値接近」という同じ見出しが +6.62% の前夜にも -3.95% の前夜にも
      出ており、語を数える方式では方向を区別できない。銅の先物価格（数値）は
      区別できるので、数値指標だけで組んでいる。

  海運:
    由来: >
      9101 日本郵船 / 9104 商船三井 の翌日リターンに対する前夜の海外指標の相関を、
      2026-05-08〜07-31 の60営業日で実測して組んだ（15指標を検定）。
      日経平均(現物) -0.41 / SEA 0.40 / 原油 0.37 / BOAT 0.34 / ZIM 0.30 が
      p<0.05 で有意。SEA⇔BOAT は 0.85 で二重計上のため1軸に集約した。
      海運株軸と原油軸の相関は 0.04 で独立している。
      不採用にしたもの:
        ドル円 -0.03（商社・8058に続き3グループ連続で無相関）
        BDRY ばら積み運賃ETF 0.06（ONE=コンテナが両社の利益中心で、本業とずれる）
        日経平均 -0.41（最強かつ有意だが、スコアに足すと成績が落ちた。
          該当16日 差+1.29pt → 日経(逆)を加えると該当10日 差+0.86pt）
    連動確認:
      国内: ["9101 日本郵船"]   # 9104との同日相関 0.79
      海外: ["SEA(海運ETF)", "原油"]
    朝スコア:
      閾値: 2
      項目:
        - 名前: 海運株（SEA・BOAT）
