          # 急変判定は平均だけでなく個別ティッカーも見る（overnight.py の
          # abs(avg) >= th or any(...)）。2銘柄あるぶん発動しやすいので、
          # 平均の90%点(2.10)ではなく実測の発動率10%に合わせる。
          急変閾値: 2.6
          不感帯: 0.2
          プラス: 前日比で上昇
          マイナス: 前日比で低下
        - 名前: 原油
